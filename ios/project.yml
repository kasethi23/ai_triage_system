name: ClinRoute
options:
  bundleIdPrefix: com.clinroute
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ClinRoute:
    type: application
    platform: iOS
    sources:
      - ClinRoute
    settings:
      base:
        # Bundle id placeholder — keep in sync with APNS_BUNDLE_ID on the backend.
        PRODUCT_BUNDLE_IDENTIFIER: com.clinroute.console
        PRODUCT_NAME: ClinRoute
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    entitlements:
      path: ClinRoute/ClinRoute.entitlements
      properties:
        # Push Notifications capability (sandbox APNs for dev builds).
        aps-environment: development
        # Time Sensitive Notifications capability.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: ClinRoute/Info.plist
      properties:
        CFBundleDisplayName: ClinRoute
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Background Modes: remote notifications.
        UIBackgroundModes:
          - remote-notification
        # Allow plain-HTTP to localhost for local dev (Config.baseURL);
        # production backends are https so this exemption never applies.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Organic design system fonts (Google Fonts, OFL) — see Theme/OrganicTheme.swift.
        UIAppFonts:
          - Caprasimo-Regular.ttf
          - Figtree-Regular.ttf
          - Figtree-Bold.ttf

  ClinRouteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ClinRouteUITests
    dependencies:
      - target: ClinRoute
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clinroute.console.uitests

schemes:
  ClinRoute:
    build:
      targets:
        ClinRoute: all
    run:
      config: Debug
    test:
      targets:
        - ClinRouteUITests
    archive:
      config: Release
